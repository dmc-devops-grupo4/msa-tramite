spring.application.name=tramites-api
server.port=${SERVER_PORT:8085}

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_tramite}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Thymeleaf 
spring.thymeleaf.cache=false

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true

# Servicios externos
uri.service.persona=${URI_SERVICE_PERSONA:http://localhost:8084}
uri.service.archivo=${URI_SERVICE_ARCHIVO:http://localhost:8087}
uri.service.notificaciones=${URI_SERVICE_NOTIFICACIONES:http://localhost:8086}
