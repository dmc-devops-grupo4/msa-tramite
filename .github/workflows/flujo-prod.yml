name: Flujo Prod

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: msa-tramite

jobs:
  pruebas-unitarias-qa:
    name: QA unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Publish test summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: QA unit test results

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports-qa
          path: '**/target/surefire-reports'
          retention-days: 7

  build-qa:
    name: Build qa
    needs: pruebas-unitarias-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build qa image
        run: docker build -t $IMAGE_NAME:qa-${{ github.sha }} .

      - name: Export qa image
        run: docker save $IMAGE_NAME:qa-${{ github.sha }} -o image-qa.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-qa-${{ github.sha }}
          path: image-qa.tar
          retention-days: 1

  owasp-scan:
    name: OWASP ZAP baseline scan
    needs: build-qa
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-qa-${{ github.sha }}

      - name: Load qa image
        run: docker load -i image-qa.tar

      - name: Start qa container
        run: docker run -d --name app-qa -p 8085:8085 $IMAGE_NAME:qa-${{ github.sha }}

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "App did not respond in time, continuing with the scan anyway"

      # The app depends on MySQL/Eureka/Kafka, which are not available in the runner,
      # so the scan does not block the pipeline if the container fails to fully start.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8085'
          cmd_options: '-I'

      - name: Stop container
        if: always()
        run: docker rm -f app-qa || true

  deploy-qa:
    name: Deploy qa
    needs: [build-qa, owasp-scan]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-qa-${{ github.sha }}

      - name: Load qa image
        run: docker load -i image-qa.tar

      - name: Deploy qa
        run: docker run -d --name app-qa-deploy -p 8085:8085 $IMAGE_NAME:qa-${{ github.sha }}

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "QA container did not respond in time"

      - name: Stop container
        if: always()
        run: docker rm -f app-qa-deploy || true

  build-prod:
    name: Build prod
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build prod image
        run: docker build -t $IMAGE_NAME:prod-${{ github.sha }} .

      - name: Export prod image
        run: docker save $IMAGE_NAME:prod-${{ github.sha }} -o image-prod.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-prod-${{ github.sha }}
          path: image-prod.tar
          retention-days: 1

  deploy-prod:
    name: Deploy prod
    needs: build-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-prod-${{ github.sha }}

      - name: Load prod image
        run: docker load -i image-prod.tar

      - name: Deploy prod
        run: docker run -d --name app-prod-deploy -p 8085:8085 $IMAGE_NAME:prod-${{ github.sha }}

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "Prod container did not respond in time"

      - name: Stop container
        if: always()
        run: docker rm -f app-prod-deploy || true
