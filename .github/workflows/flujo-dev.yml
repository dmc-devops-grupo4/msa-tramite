name: Flujo Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: msa-tramite

jobs:
  pruebas-unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: ./mvnw -B test

      - name: Publicar resumen de pruebas
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Resultados pruebas unitarias

      - name: Subir reporte de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 7

  build-dev:
    name: Build dev
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagen dev
        run: docker build -t $IMAGE_NAME:dev-${{ github.sha }} .

      - name: Exportar imagen dev
        run: docker save $IMAGE_NAME:dev-${{ github.sha }} -o image-dev.tar

      - name: Publicar artefacto de imagen
        uses: actions/upload-artifact@v4
        with:
          name: image-dev-${{ github.sha }}
          path: image-dev.tar
          retention-days: 1

  owasp-scan:
    name: OWASP ZAP baseline scan
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto de imagen
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ github.sha }}

      - name: Importar imagen dev
        run: docker load -i image-dev.tar

      - name: Iniciar contenedor dev
        run: docker run -d --name app-dev -p 8085:8085 $IMAGE_NAME:dev-${{ github.sha }}

      - name: Esperar disponibilidad
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "La app no respondio a tiempo, se continua igual con el scan"

      # La app depende de MySQL/Eureka/Kafka que no existen en el runner,
      # por eso el scan no bloquea el pipeline si el contenedor no llega a levantar del todo.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8085'
          cmd_options: '-I'

      - name: Detener contenedor
        if: always()
        run: docker rm -f app-dev || true

  deploy-dev:
    name: Deploy dev
    needs: [build-dev, owasp-scan]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Descargar artefacto de imagen
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ github.sha }}

      - name: Importar imagen dev
        run: docker load -i image-dev.tar

      - name: Deploy dev
        run: docker run -d --name app-dev-deploy -p 8085:8085 $IMAGE_NAME:dev-${{ github.sha }}

      - name: Verificar deploy
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "El contenedor de dev no respondio a tiempo"

      - name: Detener contenedor
        if: always()
        run: docker rm -f app-dev-deploy || true
