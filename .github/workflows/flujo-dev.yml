name: Flujo Dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  IMAGE_NAME: msa-tramite

jobs:
  pruebas-unitarias:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Publish test summary
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Unit test results

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: '**/target/surefire-reports'
          retention-days: 7

  build-dev:
    name: Build dev
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build dev image
        run: docker build -t $IMAGE_NAME:dev-${{ github.sha }} .

      - name: Export dev image
        run: docker save $IMAGE_NAME:dev-${{ github.sha }} -o image-dev.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-dev-${{ github.sha }}
          path: image-dev.tar
          retention-days: 1

  owasp-scan:
    name: OWASP ZAP baseline scan
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ github.sha }}

      - name: Load dev image
        run: docker load -i image-dev.tar

      - name: Start dev container
        run: docker run -d --name app-dev -p 8085:8085 $IMAGE_NAME:dev-${{ github.sha }}

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "App did not respond in time, continuing with the scan anyway"

      # The app depends on MySQL/Eureka/Kafka, which are not available in the runner,
      # so the scan does not block the pipeline if the container fails to fully start.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8085'
          cmd_options: '-I'

      - name: Stop container
        if: always()
        run: docker rm -f app-dev || true

  deploy-dev:
    name: Deploy dev
    needs: [build-dev, owasp-scan]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-dev-${{ github.sha }}

      - name: Load dev image
        run: docker load -i image-dev.tar

      - name: Deploy dev
        run: docker run -d --name app-dev-deploy -p 8085:8085 $IMAGE_NAME:dev-${{ github.sha }}

      - name: Verify deployment
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8085/actuator/info && exit 0
            sleep 5
          done
          echo "Dev container did not respond in time"

      - name: Stop container
        if: always()
        run: docker rm -f app-dev-deploy || true
